name: ci
on:
  push:
  pull_request:

jobs:
  simulator-and-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Simulador (node --test)
        run: npm run test:sim
      - name: Tabelas do firmware atualizadas
        run: node tools/gen_firmware_tables.js --check
      - name: Backend (typecheck + testes)
        working-directory: backend
        run: |
          npm ci
          npx tsc --noEmit
          npm test

  firmware-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: sudo apt-get update && sudo apt-get install -y libssl-dev cmake
      - name: Testes de host (ASan/UBSan)
        run: npm run test:firmware

  firmware-esp-idf-build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.2
    steps:
      - uses: actions/checkout@v4
      - name: idf.py build (esp32s3)
        shell: bash
        working-directory: firmware
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build
